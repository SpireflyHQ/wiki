# Spirefly's image of this branch: the upstream release it is based on plus the commits not yet
# released upstream. Built as upstream's build.yml builds a release (frontend and blocks on Node 26,
# the version stamped into package.json, dev/build/Dockerfile), for amd64 only, and pushed to
# ghcr.io/spireflyhq/wiki as `<base>-spirefly.<short sha>` and `<base>-spirefly`.
name: Spirefly image

on:
  push:
    branches:
      - 'spirefly/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26.x

      - name: Set version
        run: |
          BASE="${GITHUB_REF_NAME#spirefly/}"
          echo "BASE_TAG=${BASE}-spirefly" >> "$GITHUB_ENV"
          echo "REL_VERSION=${BASE}-spirefly.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          REL_VERSION="${BASE}-spirefly.${GITHUB_SHA::7}" yq -iP '.version = strenv(REL_VERSION)' backend/package.json -o json
          REL_VERSION="${BASE}-spirefly.${GITHUB_SHA::7}" yq -iP '.version = strenv(REL_VERSION)' frontend/package.json -o json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build blocks
        working-directory: blocks
        run: |
          npm ci
          npm run build

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: dev/build/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/spireflyhq/wiki:${{ env.REL_VERSION }}
            ghcr.io/spireflyhq/wiki:${{ env.BASE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/SpireflyHQ/wiki
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.REL_VERSION }}
            org.opencontainers.image.title=Wiki.js (Spirefly build)
            org.opencontainers.image.licenses=AGPL-3.0
